[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-geolocator"
version = "0.1.0"
description = "Estimate where in Singapore a photo was taken from visual cues."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
    "requests>=2.31",
    "rapidocr_onnxruntime>=1.2",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "osmium>=4.0"]
map = ["osmium>=4.0"]  # build-map / build-buildings read the OpenStreetMap extract

[project.scripts]
sg-geolocate = "sg_geolocator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sg_geolocator = ["data/*.json"]
