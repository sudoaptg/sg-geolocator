name: Locate photos

# Add photos to the photos/ folder (on GitHub: Add file -> Upload files) and push, or run
# this manually. The guessed location of each photo appears on the run's summary page.
on:
  push:
    paths: ["photos/**"]
  workflow_dispatch:
    inputs:
      area_guess:
        description: "Also output the area classifier's probability for every cell (for combining with other clues)"
        type: boolean
        default: false
      photo_b64:
        description: "Optional: one small JPEG as base64, located without committing it to the repo (photos/ is then ignored)"
        default: ""
      check_at:
        description: "Optional lat,lon where the photo was really taken: also report how well the skyline matches there vs random spots"
        default: ""

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Download latest indexes (scene index + area classifier, and place index if any)
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          tags = json.loads(subprocess.check_output(["gh", "release", "list", "--limit", "30", "--json", "tagName"]))
          want = {"index.npz", "places.npz", "mapmatch.npz"}
          for t in (x["tagName"] for x in tags):  # newest first
              assets = {a["name"] for a in json.loads(subprocess.check_output(
                  ["gh", "release", "view", t, "--json", "assets"]))["assets"]}
              for name in sorted(want & assets):
                  pats = {"index.npz": ["index.npz", "geocell.npz"], "mapmatch.npz": ["mapmatch.npz", "buildings.npz", "place_names.json.gz"]}.get(name, [name])
                  for pat in pats:
                      if pat in assets:
                          subprocess.check_call(["gh", "release", "download", t, "--pattern", pat])
                  print(f"{name} from {t}")
                  want.discard(name)
              if not want:
                  break
          PY
          python -c "import numpy as np; d=np.load('index.npz'); print('model=' + (str(d['model']) if 'model' in d else 'openai/clip-vit-base-patch32'))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ steps.index.outputs.model }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-hub-eigenplaces/ResNet50/512
      - name: Cache gazetteers (OSM roads, bus stops, OneMap lookups)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sg_geolocator
          key: sg-gazetteers-v1-${{ github.run_id }}
          restore-keys: sg-gazetteers-v1-
      - name: Decode the inline photo
        if: ${{ inputs.photo_b64 != '' }}
        env:
          PHOTO: ${{ inputs.photo_b64 }}
        run: mkdir -p inline && printf '%s' "$PHOTO" | base64 -d > inline/photo.jpg && ls -l inline
      - name: Locate
        run: |
          shopt -s nullglob nocaseglob
          files=(photos/*.jpg photos/*.jpeg photos/*.png photos/*.webp)
          [ -f inline/photo.jpg ] && files=(inline/photo.jpg)
          if [ ${#files[@]} -eq 0 ]; then echo "No photos in photos/"; exit 0; fi
          extra=""; [ -f geocell.npz ] && extra="--geocell geocell.npz"
          [ -f places.npz ] && extra="$extra --places places.npz"
          [ -f mapmatch.npz ] && extra="$extra --map mapmatch.npz"
          [ -f buildings.npz ] && extra="$extra --buildings buildings.npz"
          [ -f place_names.json.gz ] && mkdir -p ~/.cache/sg_geolocator && cp place_names.json.gz ~/.cache/sg_geolocator/
          sg-geolocate predict "${files[@]}" --index index.npz $extra --no-exif > results.jsonl
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from sg_geolocator.exif import read_gps
          from sg_geolocator.geo import haversine_km
          print("## Photo locations\n")
          print("| photo | guess | how | confidence | evidence | actual (photo's GPS) |")
          print("|---|---|---|---|---|---|")
          for line in open("results.jsonl"):
              if not line.startswith("{"):  # stray library output on stdout
                  continue
              r = json.loads(line)
              if "error" in r:
                  print(f"| {r['image']} | – | {r['error']} | | | |")
                  continue
              where = f"[{r['lat']:.5f}, {r['lon']:.5f}]({r['map']})"
              ev = "<br>".join(r.get("evidence", [])) or r.get("label") or ""
              gps = read_gps(r["image"])
              truth = f"off by **{haversine_km(r['lat'], r['lon'], *gps):.2f} km**" if gps else "no GPS in file"
              print(f"| {r['image']} | {where} | {r['source']} | {r['confidence']:.0%} | {ev} | {truth} |")
          print("\nGuesses ignore any GPS stored in the photo; it is only used to show the error. "
                "`text` = read from signs (`text+skyline`: then the exact viewpoint and floor from the outline of nearby blocks); `place-match` = matched to reference photos of the same "
                "spot (tens of metres); `map-match` = scene compared with map features (school, carpark, "
                "HDB era...) within the area guess; skyline hints compare the outline of "
                "nearby blocks (elevated views, experimental); `landmark`, `geocell` and `retrieval` = from how the scene "
                "looks (km-level).")
          PY
          cat results.jsonl
      - name: Area guess per cell
        if: ${{ inputs.area_guess }}
        run: |
          shopt -s nullglob nocaseglob
          files=(photos/*.jpg photos/*.jpeg photos/*.png)
          [ -f inline/photo.jpg ] && files=(inline/photo.jpg)
          sg-geolocate area-guess "${files[@]}" --geocell geocell.npz | grep '^{' > area.jsonl
          cat area.jsonl
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.area_guess }}
        with:
          name: area-guess
          path: area.jsonl
      - name: Skyline check against the known location
        if: ${{ inputs.check_at != '' }}
        run: |
          shopt -s nullglob nocaseglob
          for f in photos/*.jpg photos/*.jpeg photos/*.png; do
            sg-geolocate skyline-check "$f" --at "${{ inputs.check_at }}" --buildings buildings.npz --radius 600 | tee -a check.jsonl
          done
          { echo; echo "### Skyline check at ${{ inputs.check_at }}"; echo '```'; cat check.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locations
          path: results.jsonl
