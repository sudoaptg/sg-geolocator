name: Export area

# Plan-view map data for one box (every building outline, water, green areas, roads), for
# checking a photo's layout against the map. Published as a release asset.
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "south,west,north,east"
        required: true
      name:
        description: "Short name for the release tag"
        required: true

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install numpy pillow requests osmium
          pip install -e . --no-deps
      - run: sg-geolocate export-area --bbox "${{ inputs.bbox }}" --out area.json.gz && ls -lh area.json.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="area-${{ inputs.name }}-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" area.json.gz --title "$tag" --notes "Map data for ${{ inputs.bbox }}. Map data © OpenStreetMap contributors (ODbL)."
