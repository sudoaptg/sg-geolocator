name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit tests don't touch the model, so skip installing torch/transformers.
      - run: pip install pillow numpy requests pytest
      - run: PYTHONPATH=src pytest -q
