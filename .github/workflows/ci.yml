name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Unit tests don't touch the model, so skip installing torch/transformers.
      - run: pip install pillow numpy requests pytest
      - run: PYTHONPATH=src pytest -q

  # Loads the real CLIP model so library API changes surface here, not an hour into an index build.
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-base-patch32
      - name: Embed an image and run the pipeline end to end
        run: |
          python - <<'EOF'
          import numpy as np
          from PIL import Image
          from sg_geolocator.embedder import ClipEmbedder
          from sg_geolocator.landmarks import LandmarkRecognizer
          from sg_geolocator.retrieval import save_index, RetrievalIndex

          Image.new("RGB", (320, 240), (90, 140, 200)).save("a.jpg")
          Image.new("RGB", (320, 240), (40, 120, 40)).save("b.jpg")
          e = ClipEmbedder()
          img = e.embed_images(["a.jpg", "b.jpg"])
          assert img.shape == (2, 512) and np.allclose(np.linalg.norm(img, axis=1), 1, atol=1e-4)
          assert e.embed_texts(["a street in Singapore"]).shape == (1, 512)
          print("landmark:", LandmarkRecognizer(e).predict(img[0]))
          save_index(["a.jpg", "b.jpg"], [(1.30, 103.80), (1.35, 103.90)], ["s1", "s2"], e, "i.npz")
          print("retrieval:", RetrievalIndex("i.npz").predict(img[0], k=2))
          EOF
      - name: Cache gazetteers (OSM roads, bus stops, OneMap lookups)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sg_geolocator
          key: sg-gazetteers-v1-${{ github.run_id }}
          restore-keys: sg-gazetteers-v1-
      - name: Road network loads and finds a known junction (Orchard Rd x Scotts Rd)
        run: |
          python - <<'EOF2'
          from sg_geolocator.geo import haversine_km
          from sg_geolocator.roads import Roads
          r = Roads.load(log=print)
          print(len(r.names), "named roads")
          assert len(r.names) > 2000
          assert r.match("SCOTS ROAD") == "SCOTTS ROAD"
          js = r.junctions("ORCHARD ROAD", "SCOTTS ROAD")
          print("junctions:", js)
          assert any(haversine_km(lat, lon, 1.3048, 103.8318) < 0.5 for lat, lon in js), js
          EOF2
      - name: Read a sign with OCR and resolve it with the live gazetteers
        run: |
          python - <<'EOF2'
          from PIL import Image, ImageDraw, ImageFont
          from sg_geolocator.clues import ClueLocator
          img = Image.new("RGB", (900, 300), (30, 80, 160))
          ImageDraw.Draw(img).text((40, 100), "Bus Stop 83139", font=ImageFont.load_default(size=64), fill="white")
          img.save("sign.jpg")
          res = ClueLocator().locate("sign.jpg")
          print(res and res.text, res and res.evidence)
          assert res and abs(res.lat - 1.3145) < 0.01 and abs(res.lon - 103.91) < 0.01, res
          EOF2
